name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy icd11-search
        run: supabase functions deploy icd11-search --project-ref tvdsanagnijrockptzat
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy fhir-patient
        run: supabase functions deploy fhir-patient --project-ref tvdsanagnijrockptzat
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy fhir-encounter
        run: supabase functions deploy fhir-encounter --project-ref tvdsanagnijrockptzat
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy fhir-condition
        run: supabase functions deploy fhir-condition --project-ref tvdsanagnijrockptzat
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy fhir-bundle
        run: supabase functions deploy fhir-bundle --project-ref tvdsanagnijrockptzat
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy build-claim-bundle
        run: supabase functions deploy build-claim-bundle --project-ref tvdsanagnijrockptzat
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy claims-dispatcher
        run: supabase functions deploy claims-dispatcher --project-ref tvdsanagnijrockptzat
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy send-sms
        run: supabase functions deploy send-sms --project-ref tvdsanagnijrockptzat
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy kmhfl-proxy
        run: supabase functions deploy kmhfl-proxy --project-ref tvdsanagnijrockptzat
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}